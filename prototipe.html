<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SI Teknik JDC — Prototipe</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181F2A; --ink-2:#232C3A; --slate:#5C6675; --slate-2:#8A93A3;
    --bg:#F1F3F7; --surface:#FFFFFF; --border:#E4E8EE;
    --brand:#C22A2E; --brand-dark:#98191D; --brand-tint:#FBEAEA;
    --success:#1C8A5B; --success-bg:#E5F6EE;
    --warning:#B9750E; --warning-bg:#FCF0DA;
    --danger:#C22A2E; --danger-bg:#FBE7E8;
    --info:#2A5DA6; --info-bg:#E8F0FA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);}
  .font-display{font-family:'Space Grotesk',sans-serif;}
  .font-mono{font-family:'JetBrains Mono',monospace;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#C7CEDA;border-radius:8px;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
      radial-gradient(1100px 500px at 12% -10%, #2A3547 0%, transparent 60%),
      linear-gradient(180deg,#141A24 0%, #10151D 100%);
      padding:2rem;}
  .role-card{border:1.5px solid var(--border);border-radius:1rem;padding:1.4rem;cursor:pointer;transition:.15s;text-align:left;background:#fff;}
  .role-card:hover{border-color:var(--brand);box-shadow:0 10px 24px rgba(0,0,0,.10);transform:translateY(-2px);}
  .role-icon{width:42px;height:42px;border-radius:.65rem;display:flex;align-items:center;justify-content:center;background:var(--brand-tint);color:var(--brand);margin-bottom:.85rem;}

  /* ---------- Shell ---------- */
  .sidebar{width:260px;background:var(--ink);color:#EDEFF3;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:30;transition:transform .2s;}
  .sidebar-brand{padding:1.15rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:.6rem;}
  .brand-mark{width:34px;height:34px;border-radius:.5rem;background:var(--brand);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:.95rem;}
  .nav-scroll{flex:1;overflow-y:auto;padding:.85rem .7rem;}
  .nav-section-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:#7C8697;padding:.5rem .6rem .35rem;}
  .nav-item{display:flex;align-items:center;gap:.65rem;padding:.55rem .7rem;border-radius:.55rem;color:#B7C0CE;font-size:.84rem;font-weight:500;cursor:pointer;transition:.12s;margin-bottom:2px;}
  .nav-item svg{width:17px;height:17px;flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
  .nav-item.active{background:var(--brand);color:#fff;}
  .sidebar-foot{padding:.9rem 1rem;border-top:1px solid rgba(255,255,255,.08);font-size:.72rem;color:#7C8697;}

  .topbar{margin-left:260px;height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;position:sticky;top:0;z-index:20;}
  .main{margin-left:260px;padding:1.6rem 1.75rem 3rem;min-height:calc(100vh - 64px);}
  @media (max-width:900px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .topbar,.main{margin-left:0;}
  }

  .page-title{font-family:'Space Grotesk';font-weight:700;font-size:1.3rem;letter-spacing:-.01em;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:.9rem;padding:1.25rem;}
  .kpi-value{font-family:'Space Grotesk';font-size:1.55rem;font-weight:700;line-height:1.1;}
  .section-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);font-weight:600;}

  .badge{display:inline-flex;align-items:center;gap:.32rem;padding:.22rem .6rem;border-radius:999px;font-size:.71rem;font-weight:600;white-space:nowrap;}
  .badge-success{background:var(--success-bg);color:var(--success);}
  .badge-warning{background:var(--warning-bg);color:var(--warning);}
  .badge-danger{background:var(--danger-bg);color:var(--danger);}
  .badge-info{background:var(--info-bg);color:var(--info);}
  .badge-neutral{background:#EEF0F4;color:var(--slate);}

  table.data-table{width:100%;border-collapse:collapse;font-size:.83rem;}
  .data-table th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.045em;color:var(--slate);border-bottom:1px solid var(--border);padding:.6rem .7rem;background:#FAFBFC;white-space:nowrap;}
  .data-table td{padding:.62rem .7rem;border-bottom:1px solid var(--border);color:var(--ink-2);vertical-align:middle;}
  .data-table tr:last-child td{border-bottom:none;}
  .data-table tr:hover td{background:#FAFBFD;}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:.75rem;}
  .table-wrap .data-table{border:none;}
  .table-wrap .data-table th:first-child,.table-wrap .data-table td:first-child{padding-left:1rem;}

  .btn{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:600;padding:.5rem .9rem;border-radius:.55rem;border:1px solid transparent;transition:.12s;}
  .btn-brand{background:var(--brand);color:#fff;}
  .btn-brand:hover{background:var(--brand-dark);}
  .btn-outline{background:#fff;border-color:var(--border);color:var(--ink-2);}
  .btn-outline:hover{border-color:var(--slate-2);}
  .btn-success{background:var(--success-bg);color:var(--success);}
  .btn-success:hover{background:#d6f0e2;}
  .btn-danger{background:var(--danger-bg);color:var(--danger);}
  .btn-danger:hover{background:#f7d7d8;}
  .btn-sm{padding:.32rem .65rem;font-size:.73rem;}
  .link-btn{background:none;border:none;color:var(--brand);font-size:.78rem;font-weight:600;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:.3rem;}
  .link-btn:hover{text-decoration:underline;}
  .link-btn svg{width:14px;height:14px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .field label{font-size:.76rem;font-weight:600;color:var(--ink-2);display:block;margin-bottom:.3rem;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:.55rem;padding:.5rem .65rem;font-size:.84rem;font-family:inherit;background:#fff;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand);}

  .stepper{display:flex;align-items:flex-start;padding:.5rem 0 .25rem;}
  .step{flex:1;text-align:center;position:relative;}
  .step .dot{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--slate-2);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;margin:0 auto .4rem;border:2px solid #DEE2E9;}
  .step.done .dot{background:var(--brand);border-color:var(--brand);color:#fff;}
  .step.current .dot{background:#fff;border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 4px var(--brand-tint);}
  .step.rejected .dot{background:var(--danger);border-color:var(--danger);color:#fff;}
  .step .line{position:absolute;top:12px;left:-50%;width:100%;height:2px;background:#DEE2E9;z-index:0;}
  .step:first-child .line{display:none;}
  .step.done .line{background:var(--brand);}
  .step .label{font-size:.65rem;color:var(--slate-2);max-width:96px;margin:0 auto;line-height:1.25;position:relative;z-index:1;}
  .step.done .label,.step.current .label{color:var(--ink);font-weight:600;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(13,17,24,.52);display:flex;align-items:center;justify-content:center;z-index:50;padding:1rem;}
  .modal-box{background:#fff;border-radius:.9rem;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;}
  .modal-head{padding:1.1rem 1.3rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .modal-body{padding:1.3rem;}

  .toast-wrap{position:fixed;bottom:1.25rem;right:1.25rem;z-index:100;display:flex;flex-direction:column;gap:.5rem;}
  .toast{background:var(--ink);color:#fff;padding:.8rem 1.05rem;border-radius:.65rem;font-size:.83rem;box-shadow:0 10px 24px rgba(0,0,0,.28);display:flex;align-items:center;gap:.5rem;animation:toastIn .18s ease-out;}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .tab-btn{padding:.5rem .95rem;font-size:.8rem;font-weight:600;color:var(--slate);border-bottom:2px solid transparent;cursor:pointer;}
  .tab-btn.active{color:var(--brand);border-color:var(--brand);}

  .kpi-icon{width:38px;height:38px;border-radius:.6rem;display:flex;align-items:center;justify-content:center;}

  /* ---------- Login Form ---------- */
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeSlideOut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-14px);}}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .login-anim-in{animation:fadeSlideIn .28s cubic-bezier(.25,.8,.25,1) both;}
  .login-anim-out{animation:fadeSlideOut .2s ease-in both;}
  .login-form-card{background:#fff;border-radius:1.1rem;padding:2rem 2.25rem;max-width:420px;width:100%;margin:0 auto;box-shadow:0 24px 60px rgba(0,0,0,.32);}
  .login-form-card .field input{font-size:.9rem;padding:.6rem .75rem;border-radius:.6rem;}
  .login-form-card .field input:focus{outline:2px solid var(--brand);border-color:var(--brand);}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:2.6rem!important;}
  .pw-toggle{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--slate-2);padding:.2rem;display:flex;align-items:center;}
  .pw-toggle:hover{color:var(--ink);}
  .login-error{background:#FBE7E8;border:1px solid #F4BCBE;border-radius:.55rem;padding:.65rem .85rem;font-size:.8rem;color:var(--danger);font-weight:500;display:flex;align-items:center;gap:.5rem;animation:shake .35s ease-out;}
  .role-chip{display:inline-flex;align-items:center;gap:.5rem;background:var(--brand-tint);border:1px solid #F4BCBE;border-radius:999px;padding:.3rem .85rem .3rem .4rem;margin-bottom:1.25rem;}
  .role-chip .dot{width:28px;height:28px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .login-hint-box{background:#F8F9FB;border:1px dashed #C7CEDA;border-radius:.6rem;padding:.65rem .9rem;font-size:.76rem;color:var(--slate);margin-top:1rem;}
  .login-hint-box strong{color:var(--ink-2);}
  .role-card-selected{border-color:var(--brand)!important;box-shadow:0 0 0 3px var(--brand-tint)!important;}
</style>
</head>

<div id="app"></div>
<div id="toast-wrap" class="toast-wrap"></div>

/* ── Lama Pengerjaan helpers ── */
function daysDiff(from, to){ return Math.round((new Date(to)-new Date(from))/86400000); }

function statusTugas(t){
  const COLOR = {early:'var(--success)',ontime:'#2A5DA6',late:'var(--danger)',overdue:'var(--danger)',running:'var(--warning)'};
  if(t.tanggalSelesai){
    const selisih = daysDiff(t.tanggalSelesai, t.deadline); // + = early, - = late
    const dur = daysDiff(t.tanggalTugas, t.tanggalSelesai);
    if(selisih > 0)  return {code:'early',  label:'Lebih Awal '+selisih+' Hari',   short:'+'+selisih+' hari', selisih, dur, color:COLOR.early,  icon:'check-circle'};
    if(selisih === 0) return {code:'ontime', label:'Tepat Waktu',                  short:'Tepat',              selisih, dur, color:COLOR.ontime, icon:'check'};
    return               {code:'late',   label:'Terlambat '+Math.abs(selisih)+' Hari', short:selisih+' hari', selisih, dur, color:COLOR.late,   icon:'alert-circle'};
  }
  const remaining = daysDiff(isoOffset(0), t.deadline);
  const dur = daysDiff(t.tanggalTugas, isoOffset(0));
  if(remaining < 0) return {code:'overdue', label:'Melewati Tenggat '+Math.abs(remaining)+' Hari', short:remaining+' hari', selisih:remaining, dur, color:COLOR.overdue, icon:'alert-triangle'};
  return              {code:'running',  label:'Berjalan · '+remaining+' Hari Tersisa',             short:remaining+'h lagi', selisih:remaining, dur, color:COLOR.running, icon:'clock'};
}

function staffTaskMetrics(staffId){
  const all = tugasStaff.filter(t=>t.staffId===staffId);
  const done = all.filter(t=>t.tanggalSelesai);
  if(!done.length) return {avgDur:0, onTimeRate:0, avgSelisih:0, total:all.length, doneCount:0};
  const onTime = done.filter(t=>daysDiff(t.tanggalSelesai, t.deadline)>=0);
  const avgDur = done.reduce((a,t)=>a+daysDiff(t.tanggalTugas,t.tanggalSelesai),0)/done.length;
  const avgSelisih = done.reduce((a,t)=>a+daysDiff(t.tanggalSelesai,t.deadline),0)/done.length;
  return {avgDur:Math.round(avgDur*10)/10, onTimeRate:Math.round(onTime.length/done.length*100), avgSelisih:Math.round(avgSelisih*10)/10, total:all.length, doneCount:done.length};
}

/* Metrics berbasis WO (tasks) */
function staffWOMetrics(staffId){
  const all = tasks.filter(t=>t.tipe==='staff' && t.pelaksana===staffId);
  const done = all.filter(t=>t.tanggalSelesai);
  if(!done.length) return {avgDur:0, onTimeRate:0, avgSelisih:0, total:all.length, doneCount:0};
  const onTime = done.filter(t=>daysDiff(t.tanggalSelesai, t.deadline)>=0);
  const avgDur = done.reduce((a,t)=>a+daysDiff(t.tanggal,t.tanggalSelesai),0)/done.length;
  const avgSelisih = done.reduce((a,t)=>a+daysDiff(t.tanggalSelesai,t.deadline),0)/done.length;
  return {avgDur:Math.round(avgDur*10)/10, onTimeRate:Math.round(onTime.length/done.length*100), avgSelisih:Math.round(avgSelisih*10)/10, total:all.length, doneCount:done.length};
}

/* statusTugas generik — bekerja untuk WO maupun tugasStaff */
function statusWO(t){
  const startField = t.tanggalTugas || t.tanggal; // support both WO and tugasStaff
  const COLOR = {early:'var(--success)',ontime:'#2A5DA6',late:'var(--danger)',overdue:'var(--danger)',running:'var(--warning)'};
  if(t.tanggalSelesai){
    const selisih = daysDiff(t.tanggalSelesai, t.deadline);
    const dur = daysDiff(startField, t.tanggalSelesai);
    if(selisih > 0)  return {code:'early',   label:'Lebih Awal '+selisih+' Hari',                  short:'+'+selisih+' hari', selisih, dur, color:COLOR.early,  icon:'check-circle'};
    if(selisih === 0) return {code:'ontime',  label:'Tepat Waktu',                                  short:'Tepat',              selisih, dur, color:COLOR.ontime, icon:'check'};
    return                   {code:'late',    label:'Terlambat '+Math.abs(selisih)+' Hari',          short:selisih+' hari',      selisih, dur, color:COLOR.late,   icon:'alert-circle'};
  }
  const remaining = daysDiff(isoOffset(0), t.deadline);
  const dur = daysDiff(startField, isoOffset(0));
  if(remaining < 0) return   {code:'overdue', label:'Melewati Tenggat '+Math.abs(remaining)+' Hari', short:remaining+' hari',   selisih:remaining, dur, color:COLOR.overdue, icon:'alert-triangle'};
  return                     {code:'running',  label:'Berjalan · '+remaining+' Hari Tersisa',        short:remaining+'h lagi',  selisih:remaining, dur, color:COLOR.running, icon:'clock'};
}
function getStaffStatus(staffId){
  const active = tasks.filter(t=>t.tipe==='staff' && t.pelaksana===staffId && (t.status==='Dikerjakan' || t.status==='Menunggu'));
  return { busy: active.length>0, count: active.length, tasks: active };
}
/* ── Akses D1 Jadwal Shift ── */
function getShiftRecord(staffId, tanggal){
  return shiftAssignments.find(x=>x.staffId===staffId && x.tanggal===tanggal) || null;
}
function getStaffShift(staffId, tanggal){
  const rec = getShiftRecord(staffId, tanggal);
  return rec ? rec.shift : null;
}
function shiftById(id){ return id ? (shiftAssignments.find(x=>x.id===id) || null) : null; }
/* Shift sebuah Work Order dibaca lewat FK, bukan disalin ke tabel WO,
   sehingga selalu ikut berubah kalau Supervisor merevisi jadwal shift. */
function woShift(t){ const rec = shiftById(t.idShift); return rec ? rec.shift : null; }
function setShift(staffId, tanggal, shift, oleh){
  let rec = getShiftRecord(staffId, tanggal);
  if(rec){ rec.shift = shift; if(oleh) rec.ditetapkanOleh = oleh; }
  else { rec = {id:mkShiftId(staffId,tanggal), tanggal, staffId, shift, ditetapkanOleh:oleh||'Kindy'}; shiftAssignments.push(rec); }
  return rec;
}

/* Aturan bisnis: staff berstatus Libur / belum dijadwalkan tidak boleh
   menerima Work Order pada tanggal tersebut. */
function cekKetersediaanStaff(staffId, tanggal){
  const rec = getShiftRecord(staffId, tanggal);
  if(!rec) return {ok:false, rec:null, pesan:`${nama('staff',staffId)} belum memiliki jadwal shift pada ${fmtDate(tanggal)}. Atur shift terlebih dahulu.`};
  if(rec.shift==='Libur') return {ok:false, rec, pesan:`${nama('staff',staffId)} berstatus Libur pada ${fmtDate(tanggal)}. Pilih staff lain atau ubah jadwal shift.`};
  return {ok:true, rec, pesan:`Shift ${rec.shift} · ${SHIFT_TIME[rec.shift]}`};
}

/* Panel shift read-only di dalam modal penugasan — ikut berubah saat

/* ══ D1 · JADWAL SHIFT (khusus Staff Teknik) ══════════════════════════════
   Grain: satu baris per staff per tanggal. Vendor tidak punya shift, jadi
   tidak pernah muncul di tabel ini. Datastore terpisah dari Work Order.   */
const SHIFT_TIME  = { Pagi:'07:00 – 15:00', Sore:'15:00 – 23:00', Malam:'23:00 – 07:00', Libur:'Hari Libur' };
const POLA_SHIFT  = { S1:'Pagi', S2:'Pagi', S3:'Pagi', S4:'Sore', S5:'Pagi', S6:'Pagi', S7:'Malam' };

function mkShiftId(staffId, tanggal){ return 'SH-'+tanggal.replace(/-/g,'')+'-'+staffId; }

let shiftAssignments = [];
(function seedJadwalShift(){
  /* Roster 20 hari ke belakang s/d 6 hari ke depan. Satu staff libur bergilir
     tiap hari agar aturan "staff libur tidak bisa ditugaskan" bisa diuji. */
  for(let d=20; d>=-6; d--){
    const tgl = isoOffset(d);
    staffList.forEach((s,idx)=>{
      const giliranLibur = (((d + idx + 2) % 7) + 7) % 7 === 0;  // offset agar staff libur hari ini bukan pemegang WO
      shiftAssignments.push({
        id: mkShiftId(s.id, tgl), tanggal: tgl, staffId: s.id,
        shift: giliranLibur ? 'Libur' : (POLA_SHIFT[s.id] || 'Pagi'),
        ditetapkanOleh: 'Kindy'
      });
    });
  }
})();

/* ══ RELASI D2 Work Order → D1 Jadwal Shift ═══════════════════════════════
   WO staff menyimpan idShift (foreign key). WO vendor selalu null karena
   vendor tidak terikat shift. Kolom shift teks pada data awal dikonversi
   sekali di sini lalu dibuang, supaya tidak ada dua sumber kebenaran.     */
(function linkWorkOrderToShift(){
  tasks.forEach(t=>{
    if(t.tipe !== 'staff'){ t.idShift = null; delete t.shiftSeed; return; }
    let rec = shiftAssignments.find(x=>x.staffId===t.pelaksana && x.tanggal===t.tanggal);
    if(!rec){
      rec = {id:mkShiftId(t.pelaksana,t.tanggal), tanggal:t.tanggal, staffId:t.pelaksana,
             shift:t.shiftSeed||'Pagi', ditetapkanOleh:'Kindy'};
      shiftAssignments.push(rec);
    } else if(rec.shift === 'Libur'){
      rec.shift = t.shiftSeed || 'Pagi';  // staff yang memegang WO tidak mungkin libur
    }
    t.idShift = rec.id;
    delete t.shiftSeed;
  });
})();

/* Rekap ringkas untuk Dashboard Utilitas Manajer — bulan berjalan */
function chillerBulanIni(){
  const bln = TODAY.toISOString().slice(0,7);
  const d = chillerLogs.filter(c=>c.tanggal.startsWith(bln));
  const bermasalah = d.filter(c=>c.statusComp==='Trouble' || c.statusComp==='OFF');
  const suhuOutVals = d.filter(c=>c.suhuPipaOut!=null).map(c=>c.suhuPipaOut);
  const avgSuhuOut = suhuOutVals.length ? Math.round(suhuOutVals.reduce((a,b)=>a+b,0)/suhuOutVals.length*10)/10 : 0;
  return { jumlah:d.length, bermasalah:bermasalah.length, avgSuhuOut, hari:new Set(d.map(c=>c.tanggal)).size };
}
/* Bacaan KWH PM chiller paling akhir (lintas bulan) sebagai referensi silang dengan konsumsi listrik */
function chillerKwhTerakhir(){
  const withKwh = chillerLogs.filter(c=>c.posisiKwhPm!=null);
  if(!withKwh.length) return null;
  return [...withKwh].sort((a,b)=> (b.tanggal+b.jam).localeCompare(a.tanggal+a.jam))[0];
}
/* Status terakhir tiap unit chiller (1-4) untuk kartu ringkasan Manajer */
function chillerStatusRingkas(){
  return ['1','2','3','4'].map(no=>{
    const logs = chillerLogs.filter(c=>c.chillerNo===no && c.statusComp).sort((a,b)=> (b.tanggal+b.jam).localeCompare(a.tanggal+a.jam));
    return { chillerNo:no, last: logs[0] || null };
  });
}

function stepper(stages, currentStage, rejected){
  return `<div class="stepper">${stages.map((s,i)=>{
    let cls = i < currentStage ? 'done' : (i===currentStage ? 'current':'');
    if(rejected && i===currentStage) cls = 'rejected';
    const icon = rejected && i===currentStage ? '✕' : (i<currentStage ? '✓' : (i+1));
    return `<div class="step ${cls}"><div class="line"></div><div class="dot">${icon}</div><div class="label">${s}</div></div>`;
  }).join('')}</div>`;
}

function matchesDateFilter(raw, filter){
  if(filter.mode==='semua' || !filter.value) return true;
  if(!raw) return false;
  const datePart = String(raw).trim().slice(0,10); // yyyy-mm-dd
  if(filter.mode==='tanggal') return datePart === filter.value;
  if(filter.mode==='bulan')   return datePart.slice(0,7) === filter.value;
  if(filter.mode==='tahun')   return datePart.slice(0,4) === filter.value;
  return true;
}
function sortArr(arr,dateField,sk){
  const filter = getFilter(sk);
  const getRaw=o=>{
    const fields=Array.isArray(dateField)?dateField:[dateField];
    let v='';
    for(const f of fields){ if(o[f]){v=o[f];break;} }
    return v;
  };
  const toDate = v=>{
    if(!v) return new Date(0);
    const s=String(v).trim();
    return new Date(s.length<=10?s+'T00:00:00':s.replace(' ','T'));
  };
  const filtered = (filter.mode==='semua' || !filter.value) ? arr : arr.filter(o=>matchesDateFilter(getRaw(o), filter));
  return [...filtered].sort((a,b)=>toDate(getRaw(b))-toDate(getRaw(a)));
}
function sortControls(key){
  const f = getFilter(key);
  const YEARS = ['2022','2023','2024','2025','2026'];
  let inputHtml = '';
  if(f.mode==='tanggal'){
    inputHtml = `<input type="date" value="${f.value||''}" onchange="setFilterValue('${key}',this.value)" style="border:1px solid var(--border);border-radius:.5rem;padding:.28rem .5rem;font-size:.73rem;font-family:inherit;"/>`;
  } else if(f.mode==='bulan'){
    inputHtml = `<input type="month" value="${f.value||''}" onchange="setFilterValue('${key}',this.value)" style="border:1px solid var(--border);border-radius:.5rem;padding:.28rem .5rem;font-size:.73rem;font-family:inherit;"/>`;
  } else if(f.mode==='tahun'){
    inputHtml = `<select onchange="setFilterValue('${key}',this.value)" style="border:1px solid var(--border);border-radius:.5rem;padding:.28rem .5rem;font-size:.73rem;font-family:inherit;">
      <option value="">Pilih tahun</option>
      ${YEARS.map(y=>`<option value="${y}" ${f.value===y?'selected':''}>${y}</option>`).join('')}
    </select>`;
  }
  return `<div style="display:flex;gap:.32rem;align-items:center;flex-wrap:wrap;">
    <span style="font-size:.66rem;color:var(--slate-2);font-weight:600;letter-spacing:.04em;white-space:nowrap;padding-right:.1rem;">Filter:</span>
    <select onchange="setFilterMode('${key}',this.value)" style="border:1px solid ${f.mode!=='semua'?'var(--brand)':'var(--border)'};background:${f.mode!=='semua'?'var(--brand)':'#fff'};color:${f.mode!=='semua'?'#fff':'var(--ink-2)'};border-radius:.5rem;padding:.28rem .5rem;font-size:.73rem;font-family:inherit;font-weight:600;">
      <option value="semua" ${f.mode==='semua'?'selected':''}>Semua</option>
      <option value="tanggal" ${f.mode==='tanggal'?'selected':''}>Tanggal</option>
      <option value="bulan" ${f.mode==='bulan'?'selected':''}>Bulan</option>
      <option value="tahun" ${f.mode==='tahun'?'selected':''}>Tahun</option>
    </select>
    ${inputHtml}
  </div>`;
}

function submitLogin(roleKey){
  const user = (document.getElementById('inp-user').value||'').trim();
  const pass = (document.getElementById('inp-pass').value||'').trim();
  const errDiv = document.getElementById('login-err');
  const btn = document.getElementById('btn-login');

  const cred = CREDENTIALS[roleKey];
  const akun = userAccounts.find(a=>a.peran===roleKey && a.username===user && a.password===pass && a.status==='Aktif');

  if(!user || !pass){

  // Success — animate out then load shell
  btn.innerHTML = '<i data-lucide="loader-circle" style="width:17px;height:17px;animation:spin 1s linear infinite;"></i> Memverifikasi…';

/* Control Req. 6 — notifikasi dibentuk langsung dari data (bukan teks tetap) */
function notifItems(role){
  const out = []; const add=(n,teks,icon,goto)=>{ if(n>0) out.push({teks:teks.replace('{n}',n), icon, goto}); };
  const overdue = t => !t.tanggalSelesai && daysDiff(isoOffset(0), t.deadline) < 0;
  if(role==='manajer'){
    add(pengajuanMaterial.filter(p=>p.stage===2 && p.status==='Proses').length,'{n} pengajuan pengadaan material menunggu persetujuan Anda','package-check','approval-material');
    add(pengajuanVendor.filter(p=>p.stage===2 && p.status==='Proses').length,'{n} pengajuan vendor menunggu persetujuan Anda','handshake','approval-vendor');
    add(spkList.filter(d=>d.status.includes('Menunggu')).length + poList.filter(d=>d.status.includes('Menunggu')).length,'{n} dokumen SPK/PO menunggu tanda tangan Anda','file-signature','spk-po');
    add(penugasanKhusus.filter(p=>p.status!=='Selesai' && daysDiff(isoOffset(0),p.deadline)<0).length,'{n} penugasan khusus melewati tenggat','clipboard-list','penugasan-khusus');
  }
  if(role==='supervisor'){
    add(temuan.filter(t=>t.stage===0 && !t.closed).length,'{n} temuan baru belum ditinjau','alert-triangle','temuan');
    add(temuan.filter(t=>t.status==='Pengajuan Ditolak Manajer').length,'{n} temuan perlu ditutup karena pengajuan ditolak Manajer','x-circle','temuan');
    add(temuan.filter(t=>t.status==='Menunggu Verifikasi Supervisor').length,'{n} perbaikan temuan selesai dan menunggu verifikasi','check-circle','temuan');
    add(temuan.filter(t=>!t.closed && temuanReadyForAssign(t)).length,'{n} temuan siap ditugaskan (PO/SPK sudah terbit)','user-check','temuan');
    add(pengajuanMaterial.filter(p=>p.stage<=1 && p.status==='Proses').length,'{n} pengajuan material dari staff menunggu tinjauan','package','pengajuan-material');
    add(penugasanKhusus.filter(p=>p.status==='Menunggu Supervisor').length,'{n} penugasan khusus dari Manajer menunggu tindak lanjut','clipboard-list','penugasan-khusus');
    add(tasks.filter(t=>t.status==='Tertunda' || overdue(t)).length,'{n} pekerjaan tertunda / melewati tenggat','clock','jadwal');
  }
  if(role==='staff'){
    const my = tasks.filter(t=>t.tipe==='staff' && t.pelaksana==='S1' && !t.tanggalSelesai);
    add(my.filter(t=>t.status==='Menunggu').length,'{n} work order baru menunggu untuk dikerjakan','clipboard-list','laporan');
    add(my.filter(overdue).length,'{n} work order Anda melewati tenggat','alert-triangle','laporan');
  }
  if(role==='vendor'){
    const my = tasks.filter(t=>t.tipe==='vendor' && t.pelaksana==='V4' && !t.tanggalSelesai);
    add(my.length,'{n} jadwal maintenance aktif','calendar-days','jadwal');
    add(my.filter(overdue).length,'{n} jadwal maintenance melewati tenggat','clock','laporan');
  }
  if(role==='admin'){
    add(pengajuanMaterial.filter(p=>p.stage===3 && p.status==='Disetujui' && !p.poId).length,'{n} pengajuan material sudah di-ACC Manajer, menunggu PO','receipt','po');
    add(pengajuanVendor.filter(p=>p.stage===3 && p.status==='Disetujui' && !p.spkId).length,'{n} pengajuan vendor sudah di-ACC Manajer, menunggu SPK','file-signature','spk');
    add(poList.filter(d=>d.status.includes('Menunggu')).length + spkList.filter(d=>d.status.includes('Menunggu')).length,'{n} dokumen PO/SPK menunggu tanda tangan Manajer','clock','po');
    add(telponBills.filter(b=>!b.penagihan).length,'{n} tagihan telepon belum dibuatkan dokumen penagihan','phone','utilitas-telpon');
  }
  return out;
}

/* ---------------------------- WORK ORDER AKTIF (komponen bersama semua peran) ---------------------------- */
/* Satu sumber data (tasks), satu definisi "aktif" (status bukan Selesai).
   Staf & Vendor hanya dibedakan lewat filter tipe / pelaksana. */
function woAktif(t){ return t.status!=='Selesai'; }
function setWoTipe(v){ state.wo_tipe=v; renderView(); }
function cardWorkOrderAktif(opt){
  const own = opt.scope!=='all';
  let list = tasks.filter(woAktif);
  if(own) list = list.filter(t=>t.tipe===opt.scope.tipe && t.pelaksana===opt.scope.id);
  else { const f=state.wo_tipe||'semua'; if(f!=='semua') list=list.filter(t=>t.tipe===f); }
  const key = 'wo_aktif_'+state.role;
  const tabs = own ? '' : `<div style="display:flex;gap:.3rem;">${[['semua','Semua'],['staff','Staf'],['vendor','Vendor']].map(([v,l])=>`<button class="btn btn-sm ${(state.wo_tipe||'semua')===v?'btn-brand':'btn-outline'}" onclick="setWoTipe('${v}')">${l}</button>`).join('')}</div>`;
  const aksi = opt.kelola ? `<button class="btn btn-outline btn-sm" onclick="goto('jadwal')">Kelola Jadwal</button>` : (opt.laporan ? `<button class="btn btn-outline btn-sm" onclick="goto('laporan')">Isi Laporan</button>` : '');
  const head = own ? ['Kode','Pekerjaan','Area','Tenggat','Status','Progress']
                   : ['Kode','Pekerjaan','Pelaksana','Tipe','Area','Tenggat','Status','Progress'];
  const rows = sortArr(list,'tanggal',key).map(t=>{
    const st = statusWO(t);
    const tenggat = `<span style="color:${st.code==='overdue'?'var(--danger)':'inherit'};font-weight:${st.code==='overdue'?700:400};">${fmtDate(t.deadline)}</span>`;
    return own
      ? `<tr><td class="font-mono">${t.id}</td><td>${t.nama}</td><td>${t.area}</td><td>${tenggat}</td><td>${badge(t.status)}</td><td>${progressBtn(t)}</td></tr>`
      : `<tr><td class="font-mono">${t.id}</td><td>${t.nama}</td><td>${nama(t.tipe,t.pelaksana)}</td><td><span class="badge ${t.tipe==='vendor'?'badge-warning':'badge-info'}">${t.tipe==='vendor'?'Vendor':'Staf'}</span></td><td>${t.area}</td><td>${tenggat}</td><td>${badge(t.status)}</td><td>${progressBtn(t)}</td></tr>`;
  });
  return `<div class="card" style="margin-bottom:1.25rem;">
    ${cardHead('Work Order Aktif <span class="badge badge-neutral" style="margin-left:.4rem;vertical-align:middle;">'+list.length+'</span>', `<div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;">${tabs}${aksi}${sortControls(key)}</div>`)}
    ${table(head, rows)}
  </div>`;
}

/* Total estimasi biaya utilitas bulan berjalan — dipakai Dashboard Manajer & Dashboard Utilitas
   agar angkanya selalu sama. */
function hitungTotalBiayaUtilitas(){
  const bln = TODAY.toISOString().slice(0,7);
  const md  = utilData.filter(d=>d.tanggal.startsWith(bln));
  const kwh = md.reduce((a,d)=>a+d.listrikInternal+d.listrikEksternal,0);
  const m3  = md.reduce((a,d)=>a+d.airInternal+d.airEksternal,0);
  const listrik = kwh*TARIF_LISTRIK, air = m3*TARIF_AIR;
  const genset = gensetBulanIni().biaya;
  const telpon = telponBills[0]?.total || 0;
  return {listrik, air, genset, telpon, total: listrik+air+genset+telpon};
}

function dashboardManajer(){
  const biaya = hitungTotalBiayaUtilitas();
  const proyekBerjalan = tasks.filter(t=>t.tipe==='vendor' && t.status!=='Selesai').length;
  const approvalMenunggu = pengajuanMaterial.filter(p=>p.status==='Proses').length + pengajuanVendor.filter(p=>p.status==='Proses').length;
  return `
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.25rem;">
    ${kpi('wallet','#C22A2E','Total Estimasi Biaya Utilitas', fmtRp(biaya.total), 'Listrik + Air + Genset + Telepon · '+monthNameNow())}
    ${kpi('truck','#2A5DA6','Proyek Vendor Berjalan', proyekBerjalan)}
    ${kpi('bell','#C22A2E','Approval Menunggu', approvalMenunggu)}
  </div>
  ${cardWorkOrderAktif({scope:'all'})}
  <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:1.25rem;">
    <div class="card"><canvas id="chartKinerjaStaff" height="230"></canvas></div>
    <div class="card"><canvas id="chartKinerjaVendor" height="230"></canvas></div>
  </div>`;
}

function dashboardSupervisor(){

  const temuanBaru = temuan.filter(t=>t.stage<=1).length;

function trendLabel(curr, prev){
  if(!prev) return '–';
  const pct = Math.round((curr - prev) / prev * 100);
  if(pct > 0) return `↑ ${pct}% vs bln lalu`;
  if(pct < 0) return `↓ ${Math.abs(pct)}% vs bln lalu`;
  return 'Sama dg bln lalu';
}
function trendColor(curr, prev){ if(!prev) return 'var(--slate)'; return curr>prev?'var(--danger)':'var(--success)'; }

function submitTugas(){
  const staffId = document.getElementById('f-ts-staff').value;
  const judul   = document.getElementById('f-ts-judul').value.trim();
  const kat     = document.getElementById('f-ts-kat').value;
  const pri     = document.getElementById('f-ts-pri').value;
  const deadline= document.getElementById('f-ts-deadline').value;
  const desk    = document.getElementById('f-ts-desk').value.trim();
  if(!judul || !deadline){ toast('Judul dan tenggat wajib diisi','alert-circle'); return; }
  const staffNama = staffList.find(s=>s.id===staffId)?.nama||'-';
  const n = tugasStaff.length+1;
  const id = 'TS-'+isoOffset(0).slice(5,7)+isoOffset(0).slice(8,10)+'-'+String(n).padStart(2,'0');
  tugasStaff.push({id, judul, kategori:kat, prioritas:pri, staffId, staffNama, supervisorNama:ROLES[state.role].nama, tanggalTugas:isoOffset(0), deadline, tanggalSelesai:null, deskripsi:desk});
  addLog(`Membuat penugasan "${judul}" → ${staffNama} (tenggat: ${fmtDate(deadline)})`);
  closeModal(); toast('Penugasan berhasil diberikan','check-circle'); renderView();
}

function openMarkDoneModal(tugasId){
  const t = tugasStaff.find(x=>x.id===tugasId);
  if(!t) return;
  const st = statusTugas(t);
  const todayStr = isoOffset(0);
  openModal('Tandai Tugas Selesai', `
    <div style="background:#F8F9FB;border:1px solid var(--border);border-radius:.65rem;padding:.85rem 1rem;margin-bottom:1rem;">
      <div style="font-weight:700;font-size:.9rem;margin-bottom:.25rem;">${t.judul}</div>
      <div style="font-size:.75rem;color:var(--slate);display:flex;gap:.75rem;flex-wrap:wrap;">
        <span>Ditugaskan: <strong>${fmtDate(t.tanggalTugas)}</strong></span>
        <span>Tenggat: <strong style="color:${st.color};">${fmtDate(t.deadline)}</strong></span>
        <span class="badge badge-neutral">${t.kategori}</span>
      </div>
    </div>
    <div class="field" style="margin-bottom:.85rem;">
      <label>Tanggal Penyelesaian</label>
      <input type="date" id="f-done-tgl" value="${todayStr}" max="${todayStr}"/>
    </div>
    <div id="done-preview" style="margin-bottom:.85rem;"></div>
    <div class="field">
      <label>Catatan Penyelesaian <span style="font-weight:400;color:var(--slate);">(opsional)</span></label>
      <textarea id="f-done-catatan" rows="2" placeholder="Tuliskan hasil, kendala, atau informasi penting saat pengerjaan…"></textarea>
    </div>`,
    `<button class="btn btn-brand" onclick="submitMarkDone('${tugasId}')"><i data-lucide="check-circle"></i> Konfirmasi Selesai</button>`);
  setTimeout(()=>{
    const inp = document.getElementById('f-done-tgl');
    const prev = document.getElementById('done-preview');
    function updatePreview(){
      const tgl = inp.value; if(!tgl) return;
      const dur = daysDiff(t.tanggalTugas, tgl);
      const sel = daysDiff(tgl, t.deadline);
      const color = sel>0?'var(--success)':sel===0?'#2A5DA6':'var(--danger)';
      const label = sel>0?`✅ Lebih cepat <strong>${sel} hari</strong> dari tenggat`
                  :sel===0?`✔️ Tepat pada tenggat waktu`
                  :`⚠️ Terlambat <strong>${Math.abs(sel)} hari</strong> dari tenggat`;
      prev.innerHTML=`<div style="background:${color}12;border:1px solid ${color}40;border-radius:.6rem;padding:.65rem .9rem;font-size:.8rem;color:${color};">${label} &nbsp;·&nbsp; Lama pengerjaan: <strong>${dur} hari</strong></div>`;
    }
    inp.addEventListener('input', updatePreview); updatePreview();
  }, 80);
}

function submitMarkDone(tugasId){
  const t = tugasStaff.find(x=>x.id===tugasId); if(!t) return;
  const tgl = document.getElementById('f-done-tgl').value;
  if(!tgl){ toast('Pilih tanggal penyelesaian','alert-circle'); return; }
  t.tanggalSelesai = tgl;
  const st = statusTugas(t);
  addLog(`Menandai tugas "${t.judul}" selesai — ${st.label} (${st.dur} hari pengerjaan)`);
  closeModal();
  toast(`Selesai! ${st.label} — ${st.dur} hari pengerjaan`, st.code==='late'?'alert-circle':'check-circle');
  renderView();
}

  if(charts.vendorK) charts.vendorK.destroy();
  charts.vendorK = new Chart(c2, { type:'bar',
    data:{ labels:evaluasiVendor.map(v=>v.nama), datasets:[{label:'Kesesuaian Jadwal vs Realisasi (%)', data:evaluasiVendor.map(v=>v.kesesuaian), backgroundColor:'#B9750E'}] },
    options:{ indexAxis:'y', responsive:true, plugins:{legend:{display:false}, title:{display:true,text:'Kinerja Vendor'}}, scales:{x:{max:100}} }
  });
}
function initEvaluasiCharts(){
  const ctx = document.getElementById('chartEvalStaff');
  if(!ctx) return;
  if(charts.evalStaff) charts.evalStaff.destroy();

  const staffScores = evaluasiStaff.map(s=>{
    const rate = (s.tepatWaktu+s.telat) ? Math.round(s.tepatWaktu/(s.tepatWaktu+s.telat)*100) : 0;
    return {...s, rate};
  });

  charts.evalStaff = new Chart(ctx, {
    type:'bar',
    data:{
      labels: staffScores.map(s=>s.nama),
      datasets:[
        {
          label:'Lama Respons (/5)',
          data: staffScores.map(s=>s.lamaRespons),
          backgroundColor:'rgba(42,93,166,.8)',
          borderRadius:{topLeft:0,topRight:0,bottomLeft:4,bottomRight:4},
          stack:'score',
        },
        {
          label:'Kerapihan Pelaporan (/5)',
          data: staffScores.map(s=>s.kerapihan),
          backgroundColor:'rgba(28,138,91,.8)',
          stack:'score',
        },
        {
          label:'Kesesuaian Hasil (/5)',
          data: staffScores.map(s=>s.kesesuaian),
          backgroundColor:'rgba(185,117,14,.8)',
          borderRadius:{topLeft:4,topRight:4,bottomLeft:0,bottomRight:0},
          stack:'score',
        },
        {
          label:'Ketepatan Waktu (%)',
          data: staffScores.map(s=>s.rate/100*15),
          type:'line',
          borderColor:'#C22A2E',
          backgroundColor:'rgba(194,42,46,.1)',
          borderWidth:2.5,
          borderDash:[5,4],
          pointRadius:5,
          pointBackgroundColor:'#C22A2E',
          tension:.3,
          fill:false,
          yAxisID:'y',
          stack:undefined,
          tooltip:{
            callbacks:{
              label: ctx=>'Ketepatan Waktu: '+staffScores[ctx.dataIndex].rate+'%'
            }
          }
        },
      ]
    },
    options:{
      responsive:true,
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{ position:'bottom' },
        tooltip:{
          callbacks:{
            afterBody: items=>{
              const i = items[0].dataIndex;
              const s = staffScores[i];
              const total = s.lamaRespons+s.kerapihan+s.kesesuaian;
              return [`────────────`, `Total Kumulatif: ${total}/15 (avg ${(total/3).toFixed(1)}/5)`];
            }
          }
        }
      },
      scales:{
        x:{ stacked:true },
        y:{
          stacked:true,
          beginAtZero:true,
          max:15,
          ticks:{ stepSize:3, callback:v=>v===0?'0':v<=5?v+'\n(respons)':v<=10?v+'\n(+kerapihan)':v+'\n(maks)' },
          title:{ display:true, text:'Skor Kumulatif (maks 15)', font:{size:11} }
        }
      }
    }
  });
}

function submitShiftAssignments(){
  const today   = isoOffset(0);
  const changes = [];

  /* Integritas relasi: staff tidak boleh diliburkan selama masih memegang
     Work Order aktif pada tanggal tersebut. */
  const bentrok = staffList.filter(s=>{
    const val = document.getElementById('f-shift-'+s.id).value;
    if(val !== 'Libur') return false;
    return tasks.some(t=>t.tipe==='staff' && t.pelaksana===s.id && t.tanggal===today
                      && t.status!=='Selesai');
  });
  if(bentrok.length){
    toast(`${bentrok.map(s=>s.nama).join(', ')} masih memegang Work Order aktif hari ini — selesaikan atau alihkan dulu sebelum diliburkan.`,'alert-triangle');
    return;
  }

  staffList.forEach(s=>{
    const val    = document.getElementById('f-shift-'+s.id).value;
    const prev   = getStaffShift(s.id, today);
    setShift(s.id, today, val, ROLES[state.role].nama);
    if(prev !== val) changes.push(`${s.nama}: ${prev||'–'} → ${val}`);
  });

  /* Ringkasan perubahan untuk log & toast */
  const summary = (() => {
    const pagi  = shiftAssignments.filter(x=>x.tanggal===today&&x.shift==='Pagi').map(x=>nama('staff',x.staffId));
    const sore  = shiftAssignments.filter(x=>x.tanggal===today&&x.shift==='Sore').map(x=>nama('staff',x.staffId));
    const malam = shiftAssignments.filter(x=>x.tanggal===today&&x.shift==='Malam').map(x=>nama('staff',x.staffId));
    const libur = shiftAssignments.filter(x=>x.tanggal===today&&x.shift==='Libur').map(x=>nama('staff',x.staffId));
    return [pagi.length?'Pagi: '+pagi.join(', '):'',sore.length?'Sore: '+sore.join(', '):'',malam.length?'Malam: '+malam.join(', '):'',libur.length?'Libur: '+libur.join(', '):''].filter(Boolean).join(' | ');
  })();

  addLog(`Supervisor memperbarui pengaturan shift ${fmtDate(today)}: ${summary}${changes.length?' [Perubahan: '+changes.join('; ')+']':''}`);

  /* Perbarui notif seed agar staff melihat shift terbaru di panel notif */
  const shiftNotifIdx = notifSeed.findIndex(n=>n._shiftUpdate);
  if(shiftNotifIdx>=0) notifSeed.splice(shiftNotifIdx,1);
  notifSeed.unshift({ peran:['staff'], teks:`Supervisor Teknik telah memperbarui jadwal shift — periksa shift Anda hari ini (${fmtDate(today)})`, icon:'clock', _shiftUpdate:true });

  closeModal();
  toast(changes.length ? `Shift tersimpan · ${changes.length} perubahan: ${changes[0]}${changes.length>1?' (+'+( changes.length-1)+' lainnya)':''}` : 'Pengaturan shift tersimpan (tidak ada perubahan)', 'check-circle');
  renderView();
}
function openTaskModal(tipe){
  const list = tipe==='staff'?staffList:vendorList;

  openModal(`Tambah Work Order ${isStaff?'Staff':'Vendor'}`, `
    <div class="field" style="margin-bottom:.8rem;"><label>Nama Pekerjaan</label><input id="f-nama" placeholder="Contoh: Pengecekan AHU Lantai 4"/></div>
    <div class="field" style="margin-bottom:.8rem;"><label>${isStaff?'Staff':'Vendor'} Pelaksana</label>
      <select id="f-pelaksana" ${isStaff?'onchange="renderTaskShiftInfo()"':''}>${list.map(x=>`<option value="${x.id}">${isStaff?staffOptionLabel(x):x.nama}</option>`).join('')}</select></div>
    <div class="field" style="margin-bottom:.8rem;"><label>Area</label><input id="f-area" placeholder="Contoh: Lantai 4"/></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-bottom:${isStaff?'.8rem':'0'};">
      <div class="field"><label>Tanggal</label><input type="date" id="f-tanggal" value="${isoOffset(0)}" ${isStaff?'onchange="renderTaskShiftInfo()"':''}/></div>
      <div class="field"><label>Deadline</label><input type="date" id="f-deadline" value="${isoOffset(0)}"/></div>
    </div>
    ${isStaff?`<div class="field">
      <label>Shift Pelaksana</label>
      <div id="f-shift-info"></div>
      <div style="font-size:.71rem;color:var(--slate);margin-top:.35rem;"><i data-lucide="info" style="width:11px;height:11px;display:inline;margin-right:3px;"></i>Shift diambil otomatis dari Jadwal Shift, tidak diisi ulang di sini. Vendor tidak memiliki shift.</div>
    </div>`:''}`,
    `<button class="btn btn-brand" onclick="submitTask('${tipe}')"><i data-lucide="check"></i> Simpan Work Order</button>`);

function renderTaskShiftInfo(){
  const box = document.getElementById('f-shift-info');
  if(!box) return;
  const staffId = document.getElementById('f-pelaksana').value;
  const tgl = document.getElementById('f-tanggal').value || isoOffset(0);
  box.innerHTML = shiftInfoBox(staffId, tgl);
  lucide.createIcons();
}
function submitTask(tipe){
  const nm = document.getElementById('f-nama').value || 'Pekerjaan Baru';
  const pel = document.getElementById('f-pelaksana').value;
  const area = document.getElementById('f-area').value || '-';
  const tgl = document.getElementById('f-tanggal').value;
  const dl = document.getElementById('f-deadline').value;

  /* WO staff wajib terhubung ke baris shift yang valid; WO vendor tidak. */
  let idShift = null, shiftLabel = '';
  if(tipe==='staff'){
    const cek = cekKetersediaanStaff(pel, tgl);
    if(!cek.ok){ toast(cek.pesan,'alert-triangle'); return; }
    idShift = cek.rec.id; shiftLabel = ' — shift '+cek.rec.shift;
  }

  const id = 'WO-'+tgl.slice(5,7)+tgl.slice(8,10)+'-'+String(tasks.length+1).padStart(2,'0');
  tasks.unshift({id, nama:nm, jenis:'Terjadwal', tipe, pelaksana:pel, area, tanggal:tgl, deadline:dl, status:'Menunggu', idShift, catatan:'-'});
  addLog(`Menambahkan jadwal ${id} (${nm}) untuk ${nama(tipe,pel)}${shiftLabel}`);
  closeModal(); toast('Jadwal berhasil ditambahkan'); renderView();
}

function updateLaporanPreview(){
  const panel = document.getElementById('laporan-deadline-panel');
  const sel   = document.getElementById('f-wo');
  if(!panel || !sel) return;
  const t = tasks.find(x=>x.id===sel.value);
  if(!t) return;

  const remaining   = daysDiff(isoOffset(0), t.deadline);
  const elapsedDays = daysDiff(t.tanggal, isoOffset(0));
  const totalDays   = Math.max(daysDiff(t.tanggal, t.deadline), 1);
  const pct         = Math.min(Math.round(elapsedDays/totalDays*100), 100);
  const over        = remaining < 0;
  const barColor    = over ? 'var(--danger)' : pct>=80 ? 'var(--warning)' : 'var(--success)';

  const projSelisih = remaining; // if finished today
  const projColor   = projSelisih>0?'var(--success)':projSelisih===0?'#2A5DA6':'var(--danger)';
  const projLabel   = projSelisih>0
    ? `✅ Jika diselesaikan hari ini: <strong>lebih cepat ${projSelisih} hari</strong> dari tenggat`
    : projSelisih===0 ? `✔️ Jika diselesaikan hari ini: <strong>tepat pada tenggat</strong>`
    : `⚠️ Jika diselesaikan hari ini: <strong>terlambat ${Math.abs(projSelisih)} hari</strong> dari tenggat`;

  panel.innerHTML = `
  <div style="background:#F8F9FB;border:1px solid var(--border);border-radius:.7rem;padding:.9rem 1rem;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.55rem;flex-wrap:wrap;gap:.4rem;">
      <div style="font-size:.75rem;font-weight:700;color:var(--ink-2);">📋 Deadline Tracker — ${t.id}</div>
      <div style="font-size:.72rem;color:${over?'var(--danger)':'var(--slate)'}; font-weight:${over?700:400};">
        ${over ? '⚠ Melewati tenggat '+Math.abs(remaining)+' hari' : remaining===0?'⏰ Tenggat hari ini!':'⏳ '+remaining+' hari tersisa'}
      </div>
    </div>
    <div style="display:flex;gap:1.2rem;font-size:.73rem;color:var(--slate);margin-bottom:.5rem;flex-wrap:wrap;">
      <span>Mulai: <strong style="color:var(--ink-2);">${fmtDate(t.tanggal)}</strong></span>
      <span>Tenggat: <strong style="color:${over?'var(--danger)':'var(--ink-2)'};">${fmtDate(t.deadline)}</strong></span>
      <span>Sudah berjalan: <strong style="color:var(--ink-2);">${elapsedDays} hari</strong></span>
    </div>
    <div style="background:#EEF0F4;border-radius:999px;height:10px;overflow:hidden;margin-bottom:.3rem;">
      <div style="background:${barColor};height:10px;border-radius:999px;width:${pct}%;transition:.3s;"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:.67rem;color:var(--slate);margin-bottom:.55rem;">
      <span>Hari ke-${elapsedDays}</span><span>${pct}% waktu tenggat terpakai</span>
    </div>
    <div style="background:${projColor}12;border:1px solid ${projColor}40;border-radius:.5rem;padding:.5rem .75rem;font-size:.78rem;color:${projColor};">${projLabel}</div>
  </div>`;
}

function submitLaporan(finish){
  const id = document.getElementById('f-wo').value;
  const catatan = document.getElementById('f-catatan').value.trim();
  const buktiInput = document.getElementById('f-bukti');
  if(!catatan){ toast('Catatan kemajuan pekerjaan wajib diisi','alert-triangle'); return; }
  if(!buktiInput.files.length){ toast('Bukti pengerjaan (foto/dokumen) wajib diunggah','alert-triangle'); return; }
  const t = tasks.find(x=>x.id===id);
  if(t){
    const berkas = buktiInput.files[0];
    if(!t.laporan) t.laporan = [];
    t.laporan.push({
      tanggal:isoOffset(0),
      jam:(document.getElementById('f-jm').value||'--')+' – '+(document.getElementById('f-js').value||'--'),
      oleh:ROLES[state.role].nama, final:!!finish, catatan,
      fileName:berkas.name, url:URL.createObjectURL(berkas)
    });
    t.catatan = catatan; t.bukti = true;
    t.status = finish ? 'Selesai' : 'Dikerjakan';
    /* Penugasan khusus yang didelegasikan ikut menerima laporan staff (proses usulan 2.1.4) */
    if(t.pkId){
      const pk = penugasanKhusus.find(x=>x.id===t.pkId);
      if(pk){
        if(!pk.laporan) pk.laporan = [];
        pk.laporan.unshift({tanggal:isoOffset(0), catatan:`[${t.id} · ${ROLES[state.role].nama}] ${catatan}`, bukti:true});
        if(finish){ pk.status='Selesai'; addLog(`Penugasan khusus ${pk.id} selesai melalui ${t.id}`); }
        else if(pk.status==='Ditugaskan ke Staff'){ pk.status='Dikerjakan Staff'; }
      }
    }
    /* Temuan yang diperbaiki lewat WO ini menunggu verifikasi Supervisor */
    if(t.temuanId && finish){
      const tm = temuan.find(x=>x.id===t.temuanId);
      if(tm && !tm.closed && tm.stage===3){ tm.status='Menunggu Verifikasi Supervisor'; tm.catatan='Pekerjaan perbaikan selesai dilaporkan pada '+t.id+' — menunggu verifikasi Supervisor Teknik.'; }
    }
    if(finish){
      t.tanggalSelesai = isoOffset(0);
      const st = statusWO(t);
      addLog(`Menyelesaikan WO ${id} — ${st.label} (${st.dur} hari pengerjaan)`);
      closeModal();
      toast(`WO selesai! ${st.label} — ${st.dur} hari pengerjaan`, st.code==='late'?'alert-circle':'check-circle');
    } else {
      addLog(`Update progres WO ${id}`);
      closeModal(); toast('Update progres tersimpan');
    }
  }
  renderView();
}

      <div class="field"><label>Jam ${sesi==='start'?'Start':'OFF'}</label><input type="time" id="f-u-ch-jam" value="${sesi==='start'?'07:00':'18:00'}"/></div>

function submitUtil(){
  const tgl = document.getElementById('f-u-tgl').value || isoOffset(0);
  const jenis = document.getElementById('f-u-jenis').value;
  const kategori = document.getElementById('f-u-kategori').value;
  const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  let detail = '';
  let field = null;
  let value = null;
  let jamField = null, jamValue = null;

  /* Genset — satu jalur pencatatan, tanpa pemisahan internal/eksternal. */
  if(jenis==='genset'){
    const jamGenset  = g('f-u-jam-genset') || '-';
    const lamp       = g('f-u-lamp') || 'Normal';
    const voltGenset = g('f-u-voltgenset') || '-';
    const voltPanel  = g('f-u-voltpanel')  || '-';
    const ampere     = g('f-u-ampere')     || '-';
    const durasi     = Number(g('f-u-durasi')||0);
    const solar      = Number(g('f-u-solar') ||0);
    const ket        = (g('f-u-ket')||'').trim() || 'Pencatatan genset';
    detail = `Pukul ${jamGenset}, Lamp ${lamp}, Volt Genset ${voltGenset}V, Volt Panel ${voltPanel}V, Ampere ${ampere}A, Durasi ${durasi} jam, Solar ${solar} L`;
    const glId = 'GL-'+tgl.slice(5,7)+tgl.slice(8,10)+'-'+String(gensetLogs.length+1).padStart(3,'0');
    gensetLogs.push({id:glId, tanggal:tgl, jam:jamGenset, lamp, voltGenset, voltPanel, ampere, durasi, solar, catatan:ket});
    gensetLogs.sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
    addLog(`Menginput pencatatan genset: ${detail}`);
    closeModal();
    toast('Data genset tersimpan & Dashboard Utilitas diperbarui');
    renderView();
    return;
  }

  /* Chiller — satu entri per unit/compressor/sesi, sesuai Tabel Monitoring Operasional Chiller. */
  if(jenis==='chiller'){
    const chillerNo  = g('f-u-ch-no')  || '1';
    const compNo     = g('f-u-ch-comp')|| 'Comp 1';
    const sesi       = g('f-u-ch-sesi')|| 'start';
    const jam        = g('f-u-ch-jam') || (sesi==='cek0800'?'08:00':sesi==='cek1300'?'13:00':'-');
    const statusComp = (sesi==='start'||sesi==='off') ? (g('f-u-ch-status')||'Normal') : null;
    const suhuPHE    = (sesi==='cek1300') ? Number(g('f-u-ch-phe')||0) : null;
    const suhuIn     = Number(g('f-u-ch-suhuin')||0);
    const suhuOut    = Number(g('f-u-ch-suhuout')||0);
    const tekIn      = Number(g('f-u-ch-tekin')||0);
    const tekOut     = Number(g('f-u-ch-tekout')||0);
    const freon      = (sesi==='cek1300') ? Number(g('f-u-ch-freon')||0) : null;
    const kwhPm      = (sesi!=='start') ? Number(g('f-u-ch-kwh')||0) : null;
    const suhuLuar   = Number(g('f-u-ch-suhuluar')||0);
    const cuaca      = g('f-u-ch-cuaca') || '-';
    const catatanCh  = (g('f-u-ch-catatan')||'').trim() || '-';
    const chId = 'CH-'+tgl.slice(5,7)+tgl.slice(8,10)+'-'+String(chillerLogs.length+1).padStart(2,'0');
    chillerLogs.unshift({id:chId, tanggal:tgl, chillerNo, compNo, sesi, jam, statusComp, suhuPHE, suhuPipaIn:suhuIn, suhuPipaOut:suhuOut, tekananPipaIn:tekIn, tekananPipaOut:tekOut, freon, posisiKwhPm:kwhPm, suhuLuar, cuaca, catatan:catatanCh});
    addLog(`Mencatat monitoring Chiller ${chillerNo} (${compNo}) — ${CHILLER_SESI_LABEL[sesi]}${statusComp?', status '+statusComp:''}`);
    closeModal();
    const bermasalah = statusComp==='Trouble' || statusComp==='OFF';
    toast(bermasalah ? 'Data chiller tersimpan — status memerlukan perhatian Supervisor' : 'Data chiller tersimpan & Dashboard Utilitas diperbarui', bermasalah?'alert-triangle':'check-circle');
    renderView();
    return;
  }

  if(kategori==='internal'){
    if(jenis==='listrik'){
      value = Number(g('f-u-nilai')||0);
      field = 'listrikInternal';
      detail = `${g('f-u-meter')} pukul ${g('f-u-jam')} = ${value} kWh`;
      jamField = 'jamListrik'; jamValue = g('f-u-jam');
    } else if(jenis==='air'){
      value = Number(g('f-u-nilai')||0);
      field = 'airInternal';
      detail = `${g('f-u-meter')} pukul ${g('f-u-jam')} = ${value} m³`;
      jamField = 'jamAir'; jamValue = g('f-u-jam');
    }
  } else {
    if(jenis==='listrik'){
      const watt = Number(g('f-u-watt')||0);
      const [sh,sm] = (g('f-u-mulai')||'08:00').split(':').map(Number);
      const [eh,em] = (g('f-u-selesai')||'08:00').split(':').map(Number);
      let durHours = ((eh*60+em) - (sh*60+sm))/60;
      if(durHours < 0) durHours += 24;
      value = Math.round((watt/1000) * durHours * 100)/100;
      field = 'listrikEksternal';
      detail = `${g('f-u-pengguna')||'Tenant'} — ${watt} Watt selama ${durHours.toFixed(1)} jam ≈ ${value} kWh, Security: ${g('f-u-security')||'-'}`;
    } else if(jenis==='air'){
      value = Number(g('f-u-nilai')||0);
      field = 'airEksternal';
      detail = `${g('f-u-pengguna')||'Tenant'} pukul ${g('f-u-jam')} — ${value} m³`;
      jamField = 'jamAir'; jamValue = g('f-u-jam');
    }
  }

  if(field){
    let rec = utilData.find(d=>d.tanggal===tgl);
    if(!rec){
      rec = {tanggal:tgl, listrikInternal:0, listrikEksternal:0, airInternal:0, airEksternal:0, jamListrik:null, jamAir:null};
      utilData.push(rec);
      utilData.sort((a,b)=>a.tanggal.localeCompare(b.tanggal));
    }
    rec[field] = value;
    if(jamField && jamValue) rec[jamField] = jamValue;
  }

  addLog(`Menginput data utilitas ${jenis} — kategori ${kategori}: ${detail}`);
  closeModal();
  toast(field ? 'Data utilitas tersimpan & Dashboard Utilitas diperbarui' : 'Data utilitas tersimpan');
  renderView();
}

/* ---------------------------- 11. TEMUAN ---------------------------- */
function temuanReadyForAssign(t){
  if(t.stage>=3) return false;
  if(!t.pengajuanMaterialId && !t.pengajuanVendorId) return false;
  if(t.pengajuanMaterialId){
    const pm = pengajuanMaterial.find(x=>x.id===t.pengajuanMaterialId);
    if(!pm || !pm.poId) return false;
  }
  if(t.pengajuanVendorId){
    const pv = pengajuanVendor.find(x=>x.id===t.pengajuanVendorId);
    if(!pv || !pv.spkId) return false;
  }
  return true;
}
/* Vendor hanya melihat temuan yang ia input sendiri — tanpa detail internal
   (pengajuan material/vendor, penugasan staff, tombol proses). */

function viewTemuan(){
  if(state.role==='vendor') return viewTemuanVendor();
  const canProcess = state.role==='supervisor';
  return `<div class="card">
    ${cardHead('Daftar Temuan Kerusakan', withSort(`<button class="btn btn-brand btn-sm" onclick="openTemuanModal()"><i data-lucide="plus"></i> Laporkan Temuan</button>`,'temuan'))}
    <div style="display:flex;flex-direction:column;gap:1rem;">
    ${sortArr(temuan,'tanggal','temuan').map(t=>{
      let actionBtn = '';
      const ready = temuanReadyForAssign(t);
      const tutupBtn = `<button class="btn btn-danger btn-sm" onclick="openTutupTemuanModal('${t.id}')"><i data-lucide="x-circle"></i> Tutup Temuan</button>`;
      if(t.closed){
        actionBtn = '';
      } else if(canProcess && t.status==='Pengajuan Ditolak Manajer'){
        actionBtn = tutupBtn;
      } else if(canProcess && t.stage===0){
        actionBtn = `<button class="btn btn-success btn-sm" onclick="advanceTemuan('${t.id}')"><i data-lucide="arrow-right"></i> Tinjau</button>`;
      } else if(canProcess && t.stage===1){
        actionBtn = `<button class="btn btn-success btn-sm" onclick="openAssignModal('${t.id}')"><i data-lucide="user-check"></i> Assign ke Staff Teknik</button>
          <button class="btn btn-outline btn-sm" onclick="openProcurementModal('${t.id}')"><i data-lucide="package-plus"></i> Ajukan Pengadaan/Vendor</button>
          ${tutupBtn}`;
      } else if(canProcess && ready){
        actionBtn = `<button class="btn btn-success btn-sm" onclick="openAssignModal('${t.id}')"><i data-lucide="user-check"></i> Assign ke Staff Teknik</button>`;
        const pvReady = t.pengajuanVendorId ? pengajuanVendor.find(x=>x.id===t.pengajuanVendorId) : null;
        if(pvReady && pvReady.spkId){
          actionBtn += `<button class="btn btn-outline btn-sm" onclick="openAssignVendorModal('${t.id}')"><i data-lucide="truck"></i> Assign Vendor</button>`;
        }
      } else if(canProcess && t.stage===3){
        const woT = tasks.find(w=>w.temuanId===t.id);
        const woDone = !woT || !!woT.tanggalSelesai;
        actionBtn = woDone
          ? `<button class="btn btn-success btn-sm" onclick="advanceTemuan('${t.id}')"><i data-lucide="check"></i> Verifikasi &amp; Tandai Selesai</button>`
          : `<button class="btn btn-outline btn-sm" onclick="toast('Work Order ${woT.id} belum dilaporkan selesai oleh pelaksana','alert-triangle')"><i data-lucide="clock"></i> Menunggu Laporan Pelaksana</button>`;
      }
      const pm = t.pengajuanMaterialId ? pengajuanMaterial.find(x=>x.id===t.pengajuanMaterialId) : null;
      const pv = t.pengajuanVendorId ? pengajuanVendor.find(x=>x.id===t.pengajuanVendorId) : null;
      return `
      <div class="card" style="background:#FAFBFD;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem;">
          <div>
            <span class="font-mono" style="font-size:.72rem;color:var(--slate);">${t.id}</span>
            <div style="font-weight:700;font-size:.9rem;">${t.deskripsi}</div>
            <div style="font-size:.76rem;color:var(--slate);">${t.lokasi} · Dilaporkan oleh ${t.pelapor} · ${fmtDate(t.tanggal)}</div>
          </div>
          <div style="display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
            ${badge(t.status)}
            ${actionBtn}
          </div>
        </div>
        ${stepper(STAGES_TEMUAN, t.stage, !!t.closed || t.status==='Pengajuan Ditolak Manajer')}
        <div style="font-size:.78rem;color:var(--ink-2);margin-top:.4rem;">${t.catatan}</div>
        ${pm?`<div style="font-size:.74rem;color:var(--slate);margin-top:.3rem;"><i data-lucide="package" style="width:12px;height:12px;display:inline;margin-right:4px;"></i>Pengajuan Material <strong class="font-mono">${pm.id}</strong> — ${badge(pm.status)}${pm.poId?` · PO: <strong class="font-mono">${pm.poId}</strong>`:''}</div>`:''}
        ${pv?`<div style="font-size:.74rem;color:var(--slate);margin-top:.15rem;"><i data-lucide="handshake" style="width:12px;height:12px;display:inline;margin-right:4px;"></i>Pengajuan Vendor <strong class="font-mono">${pv.id}</strong> — ${badge(pv.status)}${pv.spkId?` · SPK: <strong class="font-mono">${pv.spkId}</strong>`:''}</div>`:''}
        ${ready?`<div style="font-size:.73rem;color:var(--success);margin-top:.3rem;font-weight:600;"><i data-lucide="check-circle" style="width:12px;height:12px;display:inline;margin-right:4px;"></i>Pengadaan sudah terbit — siap ditugaskan ke Staff Teknik${(t.pengajuanVendorId && pengajuanVendor.find(x=>x.id===t.pengajuanVendorId)?.spkId)?' atau Vendor':''}.</div>`:''}
        ${t.assignedTo?`<div style="font-size:.75rem;color:var(--slate);margin-top:.3rem;"><i data-lucide="${t.assignedType==='vendor'?'truck':'user-check'}" style="width:12px;height:12px;display:inline;margin-right:4px;"></i>${t.assignedType==='vendor'?'Dikerjakan oleh vendor':'Ditugaskan kepada'} <strong>${t.assignedTo}</strong> · Prioritas ${t.prioritas||'-'}</div>`:''}

function advanceTemuan(id){
  const t = temuan.find(x=>x.id===id);
  const labels=['Ditinjau Supervisor','Assign Perbaikan','Dikerjakan','Selesai'];
  t.stage = Math.min(t.stage+1,4);
  t.status = t.stage>=4 ? 'Selesai' : labels[t.stage-1];
  if(t.stage===1) t.catatan = 'Sudah ditinjau Supervisor Teknik — menunggu keputusan penugasan atau pengajuan pengadaan.';
  if(t.stage>=4) t.catatan = 'Perbaikan telah diverifikasi Supervisor Teknik dan temuan dinyatakan selesai.';
  addLog(`Memproses temuan ${id} → ${t.status}`);
  toast('Status temuan diperbarui'); renderView();
}

function submitProcurement(temuanId){
  const t = temuan.find(x=>x.id===temuanId);
  const needMaterial = document.getElementById('f-p-material').checked;
  const needVendor = document.getElementById('f-p-vendor').checked;
  if(!needMaterial && !needVendor){ toast('Pilih minimal salah satu: Material atau Vendor','alert-triangle'); return; }
  let refs = [];
  if(needMaterial){
    const barang = document.getElementById('f-p-barang').value || ('Material untuk '+t.deskripsi);
    const est = Number(document.getElementById('f-p-estimasi').value||0);
    const prio = document.getElementById('f-p-prio-m').value;
    const id = 'PM-'+isoOffset(0).slice(5,7)+isoOffset(0).slice(8,10)+'-'+String(pengajuanMaterial.length+1).padStart(2,'0');
    pengajuanMaterial.unshift({id, tanggal:isoOffset(0), temuan:t.id, barang, estimasi:est, deskripsi:'Terkait temuan '+t.id+': '+t.deskripsi, prioritas:prio, stage:2, status:'Proses', poId:null});
    t.pengajuanMaterialId = id; refs.push(id);
  }
  if(needVendor){
    const manualVal = (document.getElementById('f-p-vendor-other').value||'').trim();
    const vendor = manualVal || document.getElementById('f-p-vendor-pilih').value;
    const desk = document.getElementById('f-p-vendor-desk').value || ('Perbaikan terkait '+t.deskripsi);
    const prio = document.getElementById('f-p-prio-v').value;
    const id = 'PV-'+isoOffset(0).slice(5,7)+isoOffset(0).slice(8,10)+'-'+String(pengajuanVendor.length+1).padStart(2,'0');
    pengajuanVendor.unshift({id, tanggal:isoOffset(0), temuan:t.id, vendor, deskripsi:desk, prioritas:prio, stage:2, status:'Proses', spkId:null});
    t.pengajuanVendorId = id; refs.push(id);
  }
  t.stage = 2; t.status = 'Menunggu Persetujuan Manajer';
  t.catatan = 'Diajukan ke Manajer Teknik untuk persetujuan akhir ('+refs.join(', ')+').';
  addLog(`Mengajukan pengadaan (${refs.join(', ')}) untuk temuan ${t.id}, diteruskan langsung ke Manajer Teknik`);
  closeModal(); toast('Pengajuan terkirim ke Manajer Teknik'); renderView();
}

/* ---------------------------- 12. PENGAJUAN MATERIAL ---------------------------- */
function viewPengajuanMaterial(){
  const canApprove = state.role==='manajer';
  const canForward = state.role==='supervisor';

  const ringkasanPengeluaran = canApprove ? (()=>{
    const total = pengajuanMaterial.length;
    const totalNilai = pengajuanMaterial.reduce((a,p)=>a+p.estimasi,0);
    const selesai = pengajuanMaterial.filter(p=>p.status==='Selesai');
    const totalRealisasi = selesai.reduce((a,p)=>a+p.estimasi,0);
    const disetujui = pengajuanMaterial.filter(p=>p.status==='Disetujui');
    const totalDisetujui = disetujui.reduce((a,p)=>a+p.estimasi,0);
    const diproses = pengajuanMaterial.filter(p=>p.status==='Proses');
    const totalDiproses = diproses.reduce((a,p)=>a+p.estimasi,0);
    const ditolak = pengajuanMaterial.filter(p=>p.status==='Ditolak');
    const totalDitolak = ditolak.reduce((a,p)=>a+p.estimasi,0);
    const pctRealisasi = totalNilai ? Math.round(totalRealisasi/totalNilai*100) : 0;

    return `<div class="card" style="margin-bottom:1.25rem;">
      ${cardHead('Ringkasan Pengeluaran Pengadaan Material', `<span style="font-size:.72rem;color:var(--slate);">Berdasarkan seluruh pengajuan tercatat</span>`)}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-bottom:1rem;">
        ${kpi('wallet','#1C8A5B','Pengeluaran Terealisasi', fmtRp(totalRealisasi), selesai.length+' pengajuan · PO sudah terbit & selesai')}
        ${kpi('clock','#B9750E','Disetujui, Menunggu PO', fmtRp(totalDisetujui), disetujui.length+' pengajuan sudah di-ACC')}
        ${kpi('hourglass','#2A5DA6','Masih Dalam Proses', fmtRp(totalDiproses), diproses.length+' pengajuan menunggu tinjauan/approval')}
        ${kpi('x-circle','#C22A2E','Ditolak', fmtRp(totalDitolak), ditolak.length+' pengajuan ditolak')}
      </div>
      <div style="background:#F8F9FB;border:1px solid var(--border);border-radius:.7rem;padding:.9rem 1.1rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;">
        <div>
          <div style="font-size:.76rem;color:var(--slate);">Total Nilai Seluruh Pengajuan (${total} pengajuan)</div>
          <div style="font-family:'Space Grotesk';font-weight:700;font-size:1.15rem;">${fmtRp(totalNilai)}</div>
        </div>
        <div style="flex:1;min-width:200px;">
          <div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--slate);margin-bottom:.3rem;">
            <span>Realisasi terhadap total nilai pengajuan</span><span style="font-weight:700;color:var(--success);">${pctRealisasi}%</span>
          </div>
          <div style="background:#EEF0F4;border-radius:999px;height:9px;overflow:hidden;">
            <div style="background:var(--success);height:9px;border-radius:999px;width:${pctRealisasi}%;"></div>
          </div>
        </div>
      </div>
    </div>`;
  })() : '';

  return `${ringkasanPengeluaran}<div class="card">
    ${cardHead('Pengajuan Pengadaan Material', state.role!=='manajer'?withSort(`<button class="btn btn-brand btn-sm" onclick="openMaterialModal()"><i data-lucide="plus"></i> Buat Pengajuan</button>`,'pm'):sortControls('pm'))}
    <div style="display:flex;flex-direction:column;gap:1rem;">
    ${sortArr(pengajuanMaterial,'tanggal','pm').map(p=>`
      <div class="card" style="background:#FAFBFD;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem;">
          <div>
            <span class="font-mono" style="font-size:.72rem;color:var(--slate);">${p.id}</span> · <span class="badge badge-neutral">${p.prioritas}</span>
            <div style="font-weight:700;font-size:.9rem;">${p.barang}</div>
            <div style="font-size:.76rem;color:var(--slate);">${p.deskripsi} · Estimasi ${fmtRp(p.estimasi)}${p.temuan!=='-'?' · Ref. '+p.temuan:''}</div>
          </div>
          <div style="display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
            ${badge(p.status)}
            <button class="btn btn-outline btn-sm" onclick="openMaterialDetail('${p.id}')"><i data-lucide="eye"></i> Detail</button>
            ${canForward && p.stage===0 && p.status==='Proses' ? `<button class="btn btn-success btn-sm" onclick="advanceMaterial('${p.id}',true)"><i data-lucide="clipboard-check"></i> Tinjau Pengajuan</button><button class="btn btn-danger btn-sm" onclick="advanceMaterial('${p.id}',false)"><i data-lucide="x"></i> Tolak</button>`:''}
            ${canForward && p.stage===1 && p.status==='Proses' ? `<button class="btn btn-success btn-sm" onclick="advanceMaterial('${p.id}',true)"><i data-lucide="check"></i> Setujui &amp; Teruskan ke Manajer</button><button class="btn btn-danger btn-sm" onclick="advanceMaterial('${p.id}',false)"><i data-lucide="x"></i> Tolak</button>`:''}
            ${canApprove && p.stage===2 && p.status==='Proses' ? `<button class="btn btn-success btn-sm" onclick="advanceMaterial('${p.id}',true)"><i data-lucide="check"></i> Setujui</button><button class="btn btn-danger btn-sm" onclick="advanceMaterial('${p.id}',false)"><i data-lucide="x"></i> Tolak</button>`:''}
          </div>
        </div>
        ${stepper(STAGES_MATERIAL, p.stage, p.status==='Ditolak')}
      </div>`).join('')}
    </div>
  </div>`;

function submitMaterial(){
  const barang = document.getElementById('f-m-barang').value || 'Barang baru';
  const desk = document.getElementById('f-m-desk').value || '-';
  const est = Number(document.getElementById('f-m-est').value||0);

function tandaiTemuanDitolak(temuanId, pengajuanId){
  if(!temuanId || temuanId==='-') return;
  const t = temuan.find(x=>x.id===temuanId);
  if(!t || t.closed) return;
  t.status = 'Pengajuan Ditolak Manajer';
  t.catatan = 'Pengajuan '+pengajuanId+' tidak disetujui Manajer Teknik. Supervisor Teknik perlu menutup temuan ini.';
}
function advanceMaterial(id, approve){
  const p = pengajuanMaterial.find(x=>x.id===id);
  if(!approve){ p.status='Ditolak'; addLog(`Menolak pengajuan material ${id}`); tandaiTemuanDitolak(p.temuan, id); toast('Pengajuan ditolak','x-circle'); renderView(); return; }
  p.stage = Math.min(p.stage+1,4);
  p.status = p.stage>=4 ? 'Selesai' : (p.stage===3 ? 'Disetujui' : 'Proses');
  addLog(`Memproses pengajuan material ${id} ke tahap ${STAGES_MATERIAL[p.stage]}`);
  toast('Status pengajuan diperbarui'); renderView();
}

function submitPenugasanLapor(pkId, finish){
  const pk = penugasanKhusus.find(x=>x.id===pkId);
  const catatan = document.getElementById('f-pkl-catatan').value.trim();
  const buktiInput = document.getElementById('f-pkl-bukti');
  if(!catatan){ toast('Catatan kemajuan pekerjaan wajib diisi','alert-triangle'); return; }
  if(!buktiInput.files.length){ toast('Bukti pengerjaan wajib diunggah','alert-triangle'); return; }
  if(!pk.laporan) pk.laporan = [];
  pk.laporan.unshift({tanggal:isoOffset(0), catatan, bukti:true});
  if(finish){ pk.status = 'Selesai'; }
  addLog(finish ? `Menyelesaikan penugasan khusus ${pk.id}: ${pk.judul}` : `Menyimpan update progres penugasan khusus ${pk.id}`);
  closeModal(); toast(finish ? 'Penugasan ditandai selesai' : 'Update progres tersimpan'); renderView();
}

function starRating(score, max=5){
  let html='';
  for(let i=1;i<=max;i++){
    if(score>=i) html+=`<span style="color:#F5A623;">★</span>`;
    else if(score>=i-.5) html+=`<span style="background:linear-gradient(90deg,#F5A623 50%,#DEE2E9 50%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">★</span>`;
    else html+=`<span style="color:#DEE2E9;">★</span>`;
  }
  return `<span style="font-size:1.25rem;line-height:1;letter-spacing:2px;">${html}</span>`;
}
function perfLabel(avg){ return avg>=4.5?['Sangat Baik','success']:avg>=3.5?['Baik','success']:avg>=2.5?['Cukup','warning']:['Perlu Peningkatan','danger']; }

  const periode    = (document.getElementById('f-e-periode').value||monthNameNow()).trim();

  /* ── GAP #4 FIX: baca nilai skor dari form dan perbarui data evaluasi ── */
  const skor1 = Math.max(1, Math.min(5, Number(document.getElementById('f-e-1').value||4)));
  const skor2 = Math.max(1, Math.min(5, Number(document.getElementById('f-e-2').value||4)));
  const scoringChanges = [];

  if(tipe==='staff'){
    const skor3 = Math.max(1, Math.min(5, Number(document.getElementById('f-e-3').value||4)));
    const ev = evaluasiStaff.find(x=>x.id===targetId);
    if(ev){
      if(ev.lamaRespons!==skor1) scoringChanges.push(`Lama Respons ${ev.lamaRespons}→${skor1}`);
      if(ev.kerapihan !==skor2) scoringChanges.push(`Kerapihan ${ev.kerapihan}→${skor2}`);
      if(ev.kesesuaian!==skor3) scoringChanges.push(`Kesesuaian ${ev.kesesuaian}→${skor3}`);
      ev.lamaRespons = skor1; ev.kerapihan = skor2; ev.kesesuaian = skor3;
    }
  } else {
    /* Kesesuaian jadwal vendor dihitung sistem dari WO (Processing Req. 12), tidak diinput manual */
    const ev = evaluasiVendor.find(x=>x.id===targetId);
    if(ev){
      if(ev.lamaRespons!==skor1) scoringChanges.push(`Lama Respons ${ev.lamaRespons}→${skor1}`);
      if(ev.kerapihan !==skor2) scoringChanges.push(`Kerapihan ${ev.kerapihan}→${skor2}`);
      ev.lamaRespons = skor1; ev.kerapihan = skor2;
    }
  }

  if(catatan){
    const ecId = 'EC-'+isoOffset(0).slice(5,7)+isoOffset(0).slice(8,10)+'-'+String(evaluasiCatatan.length+1).padStart(2,'0');
    const r = ROLES[state.role];
    evaluasiCatatan.unshift({id:ecId, tipe, targetId, targetNama, tanggal:isoOffset(0), periode, catatan, penulis:r.nama});
  }

  const changesStr = scoringChanges.length ? ` (${scoringChanges.join(', ')})` : '';
  addLog(`Memperbarui evaluasi kinerja ${tipe} — ${targetNama}${changesStr}${catatan?' + catatan kualitatif':''}`);
  closeModal(); toast('Evaluasi tersimpan & skor diperbarui'); renderView();
}
