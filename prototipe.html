  spkList.unshift({id, vendor, perihal, noKontrak, tanggal, catatan, fileName, status:'Menunggu TTD Manajer', pengajuanId:p.id});
  p.spkId = id;
  addLog(`Mengunggah dokumen SPK ${id} (${fileName}) untuk pengajuan vendor ${p.id} — dikembalikan ke Manajer untuk ditinjau & ditandatangani`);
  closeModal(); toast('Dokumen SPK berhasil diunggah, menunggu tanda tangan Manajer'); renderView();
}
function viewPo(){
  const menunggu = pengajuanMaterial.filter(p=>p.stage===3 && p.status==='Disetujui' && !p.poId);
  return `
  ${menunggu.length? `<div class="card" style="margin-bottom:1.25rem;border-color:var(--warning);">
    ${cardHead('Pengajuan Material Sudah Di-ACC Manajer — Menunggu PO')}
    ${table(['Kode','Barang','Estimasi','Prioritas',''], menunggu.map(p=>`
      <tr><td class="font-mono">${p.id}</td><td>${p.barang}</td><td>${fmtRp(p.estimasi)}</td><td><span class="badge badge-neutral">${p.prioritas}</span></td>
      <td><button class="btn btn-brand btn-sm" onclick="openBuatPOModal('${p.id}')"><i data-lucide="receipt"></i> Buat PO</button></td></tr>`))}
  </div>` : ''}
  <div class="card">${cardHead('Pembuatan & Penerbitan Purchase Order', sortControls('po'))}
    ${table(['No. PO','Perihal','Nominal','Tanggal','Status',''], sortArr(poList,'tanggal','po').map(p=>`
      <tr><td class="font-mono">${p.id}</td><td>${p.perihal}</td><td>${fmtRp(p.nominal)}</td><td>${fmtDate(p.tanggal)}</td><td>${badge(p.status)}</td>
      <td><button class="btn btn-outline btn-sm" onclick="openDocDetail('po','${p.id}')"><i data-lucide="eye"></i> Lihat</button></td></tr>`))}
  </div>`;
}
function openBuatPOModal(pengajuanId){
  const p = pengajuanMaterial.find(x=>x.id===pengajuanId);
  const id = 'PO-2026-0'+(24+poList.length);
  openModal('Unggah Dokumen Purchase Order (PO)', `
    <p style="font-size:.73rem;color:var(--slate-2);margin-top:0;">Terbitkan PO untuk pengajuan material <strong class="font-mono">${p.id}</strong> dengan mengunggah dokumen PO (Word/PDF) yang sudah disiapkan. Dokumen akan dikembalikan ke Manajer Teknik untuk ditinjau &amp; ditandatangani di dalam sistem.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:.7rem;">
      <div class="field"><label>No. PO</label><input value="${id}" disabled/></div>
      <div class="field"><label>Tanggal PO</label><input type="date" id="fpo-tgl" value="${isoOffset(0)}"/></div>
    </div>
    <div class="field" style="margin-bottom:.7rem;"><label>Perihal</label><input id="fpo-perihal" value="${escAttr(p.barang)}"/></div>
    <div class="field" style="margin-bottom:.7rem;"><label>Nominal (Rp)</label><input type="number" id="fpo-nominal" value="${p.estimasi}"/></div>
    <div class="field" style="margin-bottom:.7rem;"><label>Unggah Dokumen PO (.docx / .pdf) <span style="color:var(--danger);">*wajib</span></label><input type="file" id="fpo-file" accept=".doc,.docx,.pdf"/></div>
    <div class="field"><label>Catatan untuk Manajer (opsional)</label><textarea id="fpo-catatan" rows="2" placeholder="Catatan tambahan"></textarea></div>`,
    `<button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-brand" onclick="submitBuatPO('${pengajuanId}','${id}')"><i data-lucide="upload"></i> Unggah &amp; Terbitkan</button>`);
}
function submitBuatPO(pengajuanId, id){
  const p = pengajuanMaterial.find(x=>x.id===pengajuanId);
  const fileInput = document.getElementById('fpo-file');
  if(!fileInput.files.length){ toast('Dokumen PO wajib diunggah','alert-triangle'); return; }
  const tanggal = document.getElementById('fpo-tgl').value || isoOffset(0);
  const perihal = document.getElementById('fpo-perihal').value || p.barang;
  const nominal = Number(document.getElementById('fpo-nominal').value || p.estimasi);
  const catatan = document.getElementById('fpo-catatan').value || '-';
  const fileName = fileInput.files[0].name;
  poList.unshift({id, perihal, nominal, tanggal, catatan, fileName, status:'Menunggu TTD Manajer', pengajuanId:p.id});
  p.poId = id;
  addLog(`Mengunggah dokumen PO ${id} (${fileName}) untuk pengajuan material ${p.id} — dikembalikan ke Manajer untuk ditinjau & ditandatangani`);
  closeModal(); toast('Dokumen PO berhasil diunggah, menunggu tanda tangan Manajer'); renderView();
}

/* ---------------------------- 17B. UTILITAS TELEPON (ADMIN) ---------------------------- */
function viewUtilitasTelpon(){
  return `<div class="card" style="margin-bottom:1.25rem;">
    ${cardHead('Pencatatan Utilitas Telepon Bulanan', withSort(`<button class="btn btn-brand btn-sm" onclick="openTelponModal()"><i data-lucide="plus"></i> Input Tagihan</button>`,'telpon'))}
    <p style="font-size:.75rem;color:var(--slate);margin:-.6rem 0 1rem;">Total tagihan telepon setiap bulan dibagi ke tiga pihak penanggung biaya: Internal JDC, Eksternal Tenant, dan Business Center.</p>
    ${table(['Bulan','Total Tagihan','Internal JDC','Eksternal Tenant','Business Center','Tanggal Input','Dokumen Penagihan'], sortArr(telponBills,'tanggal','telpon').map(b=>`
      <tr>
        <td>${b.bulan}</td>
        <td>${fmtRp(b.total)}</td>
        <td>${fmtRp(b.internal)} <span class="badge badge-neutral">${pct(b.internal,b.total)}%</span></td>
        <td>${fmtRp(b.eksternal)} <span class="badge badge-neutral">${pct(b.eksternal,b.total)}%</span></td>
        <td>${fmtRp(b.businessCenter)} <span class="badge badge-neutral">${pct(b.businessCenter,b.total)}%</span></td>
        <td>${fmtDate(b.tanggal)}</td>
        <td>${b.penagihan?`<button class="btn btn-outline btn-sm" onclick="openPenagihanModal('${b.id}')"><i data-lucide="file-check"></i> Lihat</button>`:`<button class="btn btn-brand btn-sm" onclick="openPenagihanModal('${b.id}')"><i data-lucide="file-plus"></i> Susun</button>`}</td>
      </tr>`))}
  </div>`;
}
function openTelponModal(){
  openModal('Input Tagihan Telepon Bulanan', `
    <div class="field" style="margin-bottom:.8rem;"><label>Bulan</label><input id="f-tel-bulan" value="${monthNameNow()}"/></div>
    <div class="field" style="margin-bottom:.8rem;"><label>Total Tagihan (Rp)</label><input type="number" id="f-tel-total" placeholder="0" oninput="updateTelponSisa()"/></div>
    <p style="font-size:.74rem;color:var(--slate);margin:0 0 .6rem;">Bagi total tagihan ke masing-masing pihak penanggung biaya:</p>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.7rem;margin-bottom:.6rem;">
      <div class="field"><label>Internal JDC (Rp)</label><input type="number" id="f-tel-internal" placeholder="0" oninput="updateTelponSisa()"/></div>
      <div class="field"><label>Eksternal Tenant (Rp)</label><input type="number" id="f-tel-eksternal" placeholder="0" oninput="updateTelponSisa()"/></div>
      <div class="field"><label>Business Center (Rp)</label><input type="number" id="f-tel-bc" placeholder="0" oninput="updateTelponSisa()"/></div>
    </div>
    <div id="tel-sisa-hint" style="font-size:.76rem;color:var(--slate);"></div>`,
    `<button class="btn btn-brand" onclick="submitTelpon()"><i data-lucide="check"></i> Simpan Tagihan</button>`);
  updateTelponSisa();
}
function updateTelponSisa(){
  const g = id => Number(document.getElementById(id).value||0);
  const total = g('f-tel-total');
  const sum = g('f-tel-internal') + g('f-tel-eksternal') + g('f-tel-bc');
  const sisa = total - sum;
  const hint = document.getElementById('tel-sisa-hint');
  if(!hint) return;
  if(total===0){ hint.innerHTML = ''; return; }
  if(sisa===0){ hint.innerHTML = `<span style="color:var(--success);font-weight:600;"><i data-lucide="check-circle" style="width:12px;height:12px;display:inline;margin-right:4px;"></i>Alokasi sesuai — penyimpanan dapat dilakukan.</span>`; }
  else { hint.innerHTML = `<span style="color:var(--danger);font-weight:600;"><i data-lucide="alert-circle" style="width:12px;height:12px;display:inline;margin-right:4px;"></i>${sisa>0?'Kurang teralokasikan':'Kelebihan alokasi'}: ${fmtRp(Math.abs(sisa))} — <u>penyimpanan akan ditolak</u></span>`; }
  lucide.createIcons();
}
function submitTelpon(){
  const bulan = document.getElementById('f-tel-bulan').value || monthNameNow();
  const total = Number(document.getElementById('f-tel-total').value||0);
  const internal = Number(document.getElementById('f-tel-internal').value||0);
  const eksternal = Number(document.getElementById('f-tel-eksternal').value||0);
  const bc = Number(document.getElementById('f-tel-bc').value||0);
  const sum = internal + eksternal + bc;
  if(total<=0){ toast('Total tagihan wajib diisi','alert-triangle'); return; }
  if(sum !== total){
    toast(`Penyimpanan ditolak — Alokasi (${fmtRp(sum)}) tidak sama dengan total tagihan (${fmtRp(total)}). Periksa kembali pembagian ke tiga pihak.`, 'alert-triangle');
    return;
  }
  const id = 'TEL-'+String(TODAY.getFullYear())+'-'+String(telponBills.length+1).padStart(2,'0');
  telponBills.unshift({id, bulan, total, internal, eksternal, businessCenter:bc, tanggal:isoOffset(0)});
  addLog(`Menginput tagihan telepon ${bulan}: ${fmtRp(total)} (Internal JDC ${fmtRp(internal)}, Eksternal Tenant ${fmtRp(eksternal)}, Business Center ${fmtRp(bc)})`);
  closeModal(); toast('Tagihan telepon tersimpan'); renderView();
}

/* Proses usulan 1.5.3 — menyusun dokumen penagihan ke pihak terkait dari data alokasi tagihan */
function penagihanHtml(b){
  const pihak = [['Internal JDC',b.internal],['Eksternal Tenant',b.eksternal],['Business Center',b.businessCenter]];
  const no = 'TGH-TEL-'+String(b.id||'').replace(/[^0-9A-Za-z]/g,'');
  return `<div style="font-family:Inter,Arial,sans-serif;color:#181F2A;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #C22A2E;padding-bottom:.6rem;margin-bottom:.8rem;">
      <div><div style="font-weight:800;font-size:1.05rem;">DOKUMEN PENAGIHAN UTILITAS TELEPON</div>
      <div style="font-size:.78rem;color:#5C6675;">Departemen Teknik — Jakarta Design Center</div></div>
      <div style="text-align:right;font-size:.76rem;color:#5C6675;">No. ${no}<br/>Periode: <strong>${b.bulan}</strong><br/>Tanggal: ${fmtDate(isoOffset(0))}</div>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
      <thead><tr style="background:#F1F3F7;"><th style="text-align:left;padding:.45rem;border:1px solid #E4E8EE;">Pihak Penanggung</th><th style="text-align:right;padding:.45rem;border:1px solid #E4E8EE;">Porsi</th><th style="text-align:right;padding:.45rem;border:1px solid #E4E8EE;">Jumlah Tagihan</th></tr></thead>
      <tbody>${pihak.map(([p,v])=>`<tr><td style="padding:.45rem;border:1px solid #E4E8EE;">${p}</td><td style="text-align:right;padding:.45rem;border:1px solid #E4E8EE;">${pct(v,b.total)}%</td><td style="text-align:right;padding:.45rem;border:1px solid #E4E8EE;">${fmtRp(v)}</td></tr>`).join('')}
      <tr style="font-weight:700;"><td style="padding:.45rem;border:1px solid #E4E8EE;">Total Tagihan Provider</td><td style="text-align:right;padding:.45rem;border:1px solid #E4E8EE;">100%</td><td style="text-align:right;padding:.45rem;border:1px solid #E4E8EE;">${fmtRp(b.total)}</td></tr></tbody>
    </table>
    <p style="font-size:.74rem;color:#5C6675;margin-top:.8rem;">Dokumen ini disusun otomatis dari data tagihan telepon bulanan yang dicatat Admin Teknik pada Sistem Informasi Departemen Teknik.</p>
  </div>`;
}
function openPenagihanModal(id){
  const b = telponBills.find(x=>x.id===id);
  openModal('Dokumen Penagihan — '+b.bulan, penagihanHtml(b),
    `<button class="btn btn-outline" onclick="closeModal()">Tutup</button><button class="btn btn-brand" onclick="unduhPenagihan('${id}')"><i data-lucide="download"></i> ${b.penagihan?'Unduh Ulang':'Simpan &amp; Unduh'}</button>`);
}
function unduhPenagihan(id){
  const b = telponBills.find(x=>x.id===id);
  const html = '<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><title>Penagihan Telepon '+b.bulan+'</title></head><body style="max-width:760px;margin:2rem auto;padding:0 1rem;">'+penagihanHtml(b)+'</body></html>';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download = 'Penagihan_Telepon_'+String(b.bulan).replace(/\s+/g,'_')+'.html';
  document.body.appendChild(a); a.click(); a.remove();
  if(!b.penagihan){ b.penagihan = true; addLog(`Menyusun dokumen penagihan telepon ${b.bulan} untuk Internal JDC, Eksternal Tenant, dan Business Center`); }
  closeModal(); toast('Dokumen penagihan tersusun & diunduh'); renderView();
}

/* ---------------------------- 18. HISTORI ---------------------------- */
function viewHistori(){
  const r = ROLES[state.role];
  // Hak akses: setiap peran hanya melihat log aktivitas yang dilakukan oleh perannya sendiri.
  const logPeran = logHistori.filter(l => l.peran === r.label);
  return `<div class="card">${cardHead(`Log Histori Aktivitas — ${r.label}`, `<div style="display:flex;gap:.5rem;align-items:center;">${sortControls('histori')}<span style="font-size:.72rem;color:var(--slate);">Mencatat user, waktu, tanggal &amp; kegiatan</span></div>`)}
    <p style="font-size:.75rem;color:var(--slate);margin:-.6rem 0 1rem;display:flex;align-items:center;gap:.35rem;">
      <i data-lucide="lock" style="width:13px;height:13px;"></i>
      Sesuai hak akses, log yang ditampilkan hanya aktivitas peran <strong>${r.label}</strong>. Aktivitas peran lain tidak dapat diakses dari sini.
    </p>
    ${table(['Waktu','Pengguna','Peran','Kegiatan'], sortArr(logPeran,'waktu','histori').map(l=>`
      <tr><td class="font-mono" style="white-space:nowrap;">${l.waktu}</td><td>${l.user}</td><td><span class="badge badge-neutral">${l.peran}</span></td><td>${l.kegiatan}</td></tr>`))}
  </div>`;
}

/* ---------------------------- 19. MODAL & ROLE SWITCH ---------------------------- */
function openModal(title, bodyHtml, footHtml){
  const wrap = document.createElement('div');
  wrap.className='modal-backdrop'; wrap.id='modal-root';
  wrap.innerHTML = `<div class="modal-box">
    <div class="modal-head"><h3 class="font-display" style="margin:0;font-size:1.02rem;">${title}</h3>
      <button class="btn btn-outline btn-sm" onclick="closeModal()"><i data-lucide="x"></i></button></div>
    <div class="modal-body">${bodyHtml}</div>
    <div style="padding:0 1.3rem 1.3rem;display:flex;justify-content:flex-end;gap:.5rem;">${footHtml||''}</div>
  </div>`;
  document.body.appendChild(wrap);
  lucide.createIcons();
}
function closeModal(){ const m = document.getElementById('modal-root'); if(m) m.remove(); }
function openRoleSwitch(){
  openModal('Ganti Peran (Demo)', `<div style="display:grid;grid-template-columns:1fr 1fr;gap:.7rem;">
    ${Object.entries(ROLES).map(([key,r])=>`<div class="role-card" style="padding:1rem;" onclick="switchRole('${key}')">
      <div class="role-icon" style="width:34px;height:34px;margin-bottom:.5rem;"><i data-lucide="${r.icon}" style="width:16px;height:16px;"></i></div>
      <div style="font-weight:700;font-size:.82rem;">${r.label}</div>
      <div style="font-size:.68rem;color:var(--slate);">${r.nama}</div>
    </div>`).join('')}
  </div>`, '');
}

/* ---------------------------- INIT ---------------------------- */
renderLogin();
</script>
